[project]
name = "enterprise-policy-agent"
version = "0.1.0"
description = "Enterprise policy question-answering and workflow processing Agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--basetemp=.pytest_tmp",
]
[tool.ruff]
line-length = 100
target-version = "py312"