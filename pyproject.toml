[project]
name = "enterprise-policy-agent"
version = "0.1.0"
description = "Enterprise policy question-answering and workflow processing Agent"
requires-python = ">=3.12,<3.13"

dependencies = [
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "sentence-transformers>=5.0,<6.0",
    "openai>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "langgraph>=1.2,<2.0",
    "fastapi>=0.140,<1.0",
    "httpx>=0.28,<1.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--basetemp=.pytest_tmp",
]
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
exclude = [
    "data",
    "data.*",
    "tests",
    "tests.*",
    "scripts",
    "scripts.*",
]
namespaces = false
