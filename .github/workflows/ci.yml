name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  quality:
    name: Python quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify installed dependency consistency
        run: python -m pip check

      - name: Validate CI security and quality contract
        run: python -m scripts.verify_ci_configuration

      - name: Lint source and tests
        run: python -m ruff check .

      - name: Run the complete pytest suite
        run: python -m pytest --junitxml=artifacts/test-results/pytest.xml

      - name: Run the offline golden evaluation
        run: python -X utf8 -m scripts.run_golden_evaluation --mode offline

      - name: Run the offline performance budget
        run: python -X utf8 -m scripts.run_performance_benchmark --warmups 1 --iterations 5

      - name: Verify the Redis LLM cache contract
        run: python -X utf8 -m scripts.verify_llm_cache

      - name: Verify async LLM single-flight coordination
        run: python -X utf8 -m scripts.verify_async_singleflight

      - name: Run the offline concurrency load benchmark
        run: >-
          python -X utf8 -m scripts.run_concurrency_load_test
          --requests 24 --concurrency 12 --provider-latency-ms 15

      - name: Build the Python wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

      - name: Upload test and evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            artifacts/test-results/pytest.xml
            artifacts/evaluation/golden-evaluation-report.json
            artifacts/evaluation/golden-evaluation-report.md
            artifacts/performance/agent-performance-report.json
            artifacts/performance/agent-performance-report.md
            artifacts/performance/agent-concurrency-load-report.json
            artifacts/performance/agent-concurrency-load-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable wheel
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-wheel-${{ github.run_id }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: Dependency risk review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced high-risk dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          license-check: false

  container-build:
    name: Container build verification
    if: ${{ github.event_name != 'pull_request' }}
    needs:
      - quality
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare non-secret Compose configuration
        run: cp .env.example .env

      - name: Prepare verified CPU PyTorch wheel when Dockerfile requires it
        run: |
          wheel_path="vendor/wheels/torch-2.12.1+cpu-cp312-cp312-manylinux_2_28_x86_64.whl"
          if grep -Fq "$wheel_path" Dockerfile; then
            mkdir -p "$(dirname "$wheel_path")"
            curl --fail --location --retry 5 --retry-all-errors \
              --output "$wheel_path" \
              "https://download.pytorch.org/whl/cpu/torch-2.12.1%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl"
            echo "ae4bb28409f5370852bd71af221066236c38d647f780d9b0a7240c330a9c12df  $wheel_path" \
              | sha256sum --check
          fi

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Build the runtime image
        run: docker build --pull --tag enterprise-policy-agent:ci .

      - name: Verify image user and Python package
        run: |
          test "$(docker image inspect enterprise-policy-agent:ci --format '{{.Config.User}}')" = "agent"
          docker run --rm --entrypoint python enterprise-policy-agent:ci -c "import app"
